[package]
name = "vox-agent-desktop-tauri"
version = "4.2.10"
edition = "2021"
description = "Cross-platform desktop shell for Vox Agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Development only: lets a build launch an engine from VOXAGENT_ENGINE_EXECUTABLE
# or `vox-engine` on PATH (debug builds already may). Never a default; release
# packaging must not enable it (T29a).
dev-engine = []

[dependencies]
base64 = "0.22"
cpal = "0.18.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
urlencoding = "2"
# Already in the lockfile via rustls / tauri; used directly for the signed
# update manifest (T42a): Ed25519 verification and version ordering.
ring = "0.17.14"
semver = "1.0.27"
# Platform credential stores must be selected explicitly: keyring 3.x has no
# default features and silently falls back to an in-process mock otherwise.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tempfile = "3"
vox-agent-input-output = { path = "../../../crates/input-output" }
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.8.2", features = ["derive"] }
hmac = "0.12.1"
sha2 = "0.10.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-dialog = "2.7.3"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false }
# cpal 0.18 accepts windows-core 0.61 through 0.62 but its `windows` crate
# must resolve to the matching ABI generation. Tauri currently uses 0.61;
# pinning the shared core prevents Cargo from selecting 0.62 for cpal alone.
windows-core = "=0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lib]
name = "vox_agent_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Mock runtime for capability tests against the real generated ACL.
tauri = { version = "2", features = ["tray-icon", "test"] }
